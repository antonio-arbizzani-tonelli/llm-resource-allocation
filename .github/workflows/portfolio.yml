name: Verified Python and native allocation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -q
      - run: python examples/stage1_quickstart.py
      - run: python examples/stage2_quickstart.py
      - run: python scripts/prepare_release.py --check

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: make -C cpp -j4 all test openmp campaign-test
      - run: make -C cpp -j4 MODE=sanitize test campaign-test
      - run: python scripts/check_cpp_parity.py --frozen
      - run: python scripts/check_openmp_campaign.py --output results/openmp/check
