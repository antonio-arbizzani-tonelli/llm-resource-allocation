[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-resource-allocation"
version = "0.1.0"
description = "Verified Python and C++ allocation for heterogeneous LLM workloads"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Antonio Arbizzani Tonelli"}]
dependencies = [
    "highspy==1.14.0",
    "pyomo==6.10.0",
]

[project.optional-dependencies]
gurobi = ["gurobipy==13.0.3"]
plots = ["matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]
